<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Riviera Tower Supervision</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- ZONE DE CONTRÔLE (Filtres) -->
    <div id="controls-section">
        <!-- Attribut 'multiple' ajouté pour permettre la multi-sélection -->
        <label>Manager :</label>
        <select id="managerSelect" multiple onchange="window.applyFilters()">
            <!-- Options générées dynamiquement -->
        </select>
        
        <label>Superviseur :</label>
        <select id="supervisorSelect" multiple onchange="window.applyFilters()">
            <!-- Options générées dynamiquement -->
        </select>

        <button onclick="window.printDisplayedTimesheets()">🖨️ Sélectionner et Imprimer (Masse)</button>
    </div>

    <!-- ZONE D'AFFICHAGE DES CARTES -->
    <div id="cards-container">
        <!-- 
        EXEMPLE DE CARTE : Si tu génères ce HTML via JavaScript dans renderCards(), 
        intègre cette structure avec les attributs window.handleCheck et window.printSingleTimesheet 
        -->
        <div class="card" data-category="civil">
            <div class="card-header">
                <h3>Nom_du_Superviseur</h3>
                
                <!-- CORRECTION BUG 1 : Appel explicite à window.handleCheck -->
                <label>
                    <input type="checkbox" value="Nom_du_Superviseur" onchange="window.handleCheck(this)"> 
                    Sélectionner
                </label>
                
                <!-- CORRECTION BUG 2 : Nouveau bouton d'impression directe (à masquer selon le rôle si besoin) -->
                <button class="btn-print-single" onclick="window.printSingleTimesheet('Nom_du_Superviseur')">
                    🖨️ Imprimer cette fiche
                </button>
            </div>
            
            <div class="tasks-container">
                <!-- Sous-tâches (Drag & Drop SortableJS) -->
                <div class="task">
                    <h4>Chef_Equipe - Ferraillage (DSS)</h4>
                    <ul class="worker-list">
                        <li>Ouvrier 1 (DSS)</li>
                        <li>Ouvrier 2 (DSS)</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <!-- ... [Tes scripts externes : Firebase, SortableJS, SheetJS] -->
    <script src="app.js"></script>
</body>
</html>
